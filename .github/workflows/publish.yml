name: Package and verify release

# Marketplace publication is a manual portal step completed before the release tag. This workflow creates
# and verifies the five release packages; it never publishes them (see RELEASE-CHECKLIST.md).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: package + execute (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            runner: windows-latest
          - target: win32-arm64
            runner: windows-11-arm
          - target: linux-x64
            runner: ubuntu-latest
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install extension dependencies from the lockfile
        working-directory: Semanticus.VSCode
        run: npm ci --no-fund --no-audit
      # scripts/package.mjs runs build:webview and compile before vsce, so the
      # VSIX is packed from generated bundles that are no longer in git.
      - name: Package, extract, and execute the production VSIX engine
        working-directory: Semanticus.VSCode
        run: npm run package -- ${{ matrix.target }}
        env:
          SEMANTICUS_REQUIRE_HOST_EXECUTION: '1'
          SEMANTICUS_RUNNER_LABEL: ${{ matrix.runner }}
      - uses: actions/upload-artifact@v4
        with:
          name: semanticus-${{ matrix.target }}-vsix
          path: |
            Semanticus.VSCode/dist/semanticus-${{ matrix.target }}-*.vsix
            Semanticus.VSCode/dist/semanticus-${{ matrix.target }}-*.evidence.json
          if-no-files-found: error

  verify:
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          pattern: semanticus-*-vsix
          path: Semanticus.VSCode/dist
          merge-multiple: true
      - name: Require five matching-host execution records and matching SHA-256 digests
        run: node Semanticus.VSCode/scripts/verify-vsix-matrix.mjs Semanticus.VSCode/dist
